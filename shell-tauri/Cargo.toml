[package]
name = "lumen"
version = "1.0.5-beta"
description = "lumen.cpp - Tauri shell (development build)"
license = "Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "lumen"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
# Pinned exactly: the browser panel is a child webview of the main window, Tauri's `unstable` multi-webview API (spec 5.2, 6.1).
tauri = { version = "=2.12.4", features = ["unstable"] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
percent-encoding = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse"] }
# Platform services (Task 6), pinned exactly. Dialogs (rfd directly: no Tauri plugin, so no init script in any webview) and the
# opener (its Rust function only; the plugin is not registered) are called from Rust only.
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-opener = "=2.7.2"
arboard = "=3.7.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Electron safeStorage (Chromium os_crypt) format: AES-256-GCM with a DPAPI-protected key in Local State.
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
zeroize = "=1.9.1"
base64 = "=0.22.1"
getrandom = "=0.3.4"

[features]
# Test builds only: lets --ui-check open WebView2's remote debugging port. Production builds have no code path for it.
ui-check = []

[profile.release]
codegen-units = 4
lto = false
opt-level = "s"
strip = true
panic = "unwind"
